apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "calendar-chart.fullname" . }}-http
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.http.host }}
      http:
        paths:
          - path: {{ .Values.ingress.http.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.calendarHttp.name }}
                port:
                  number: {{ .Values.calendarHttp.port }}